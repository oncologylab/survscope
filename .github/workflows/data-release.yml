name: Build survival data release

on:
  workflow_dispatch:
    inputs:
      data_version:
        description: Immutable data version (YYYY.MM.DD)
        required: true
        default: "2026.09.18"
      cohorts:
        description: "all (TCGA) or comma-separated TCGA/CPTAC-3 cohort codes"
        required: true
        default: "all"
      include_cptac:
        description: Also build all 18 supported CPTAC-3 RNA/OS cohorts
        type: boolean
        default: true
      tcga_data_version:
        description: Compact TCGA release to reuse (blank rebuilds TCGA from source)
        required: false
        default: "2026.07.28"

permissions:
  contents: write

concurrency:
  group: survscope-data-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      DATA_VERSION: ${{ inputs.data_version }}
      COHORT_INPUT: ${{ inputs.cohorts }}
      INCLUDE_CPTAC: ${{ inputs.include_cptac }}
      TCGA_DATA_VERSION: ${{ inputs.tcga_data_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - name: Validate immutable tag
        shell: bash
        run: |
          if [[ ! "$DATA_VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]]; then
            echo "data_version must use YYYY.MM.DD" >&2
            exit 2
          fi
          if gh release view "data-v${DATA_VERSION}" >/dev/null 2>&1; then
            echo "data-v${DATA_VERSION} already exists; data releases are immutable" >&2
            exit 2
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/data-v${DATA_VERSION}"; then
            echo "Data tag already exists; choose a new immutable version" >&2
            exit 2
          fi
      - name: Download verified compact TCGA base
        if: inputs.tcga_data_version != ''
        shell: bash
        run: |
          if [[ ! "$TCGA_DATA_VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]]; then
            echo "Invalid TCGA_DATA_VERSION" >&2
            exit 2
          fi
          archive_name="survscope-data-${TCGA_DATA_VERSION}.tar"
          mkdir -p tcga-download tcga-base
          gh release download "data-v${TCGA_DATA_VERSION}" \
            --pattern "${archive_name}*" --dir tcga-download
          (
            cd tcga-download
            sha256sum -c "${archive_name}.sha256"
          )
          tar -xf "tcga-download/${archive_name}" -C tcga-base
      - name: Stream and compact selected cohorts
        shell: bash
        run: |
          python - <<'PY'
          import os
          from survscope.builder import main
          from survscope.constants import COHORTS
          from survscope.cptac import CPTAC_COHORTS

          requested = os.environ["COHORT_INPUT"]
          cohorts = list(COHORTS) if requested == "all" else [
              code.strip().upper() for code in requested.split(",")
          ]
          if os.environ["INCLUDE_CPTAC"] == "true":
              cohorts.extend(CPTAC_COHORTS)
          cohorts = list(dict.fromkeys(cohorts))
          args = ["--cohorts", *cohorts, "--outdir", "data-build",
                  "--data-version", os.environ["DATA_VERSION"]]
          if os.environ["TCGA_DATA_VERSION"]:
              args.extend(["--tcga-release", "tcga-base"])
          main(args)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"EXPECTED_COHORTS={len(cohorts)}\n")
          PY
      - name: Validate complete release
        run: |
          python scripts/validate_data_release.py \
            --dir data-build \
            --expected-cohorts "$EXPECTED_COHORTS" \
            --max-bytes 891289600 \
            --max-assets 999
      - name: Package release in one API-friendly archive
        shell: bash
        run: |
          archive_name="survscope-data-${DATA_VERSION}.tar"
          tar -cf "$archive_name" -C data-build .
          sha256sum "$archive_name" > "${archive_name}.sha256"
          archive_bytes="$(stat -c %s "$archive_name")"
          echo "Archive: ${archive_bytes} bytes"
          test "$archive_bytes" -le 891289600
          echo "ARCHIVE_NAME=${archive_name}" >> "$GITHUB_ENV"
      - name: Publish immutable release assets
        shell: bash
        run: |
          tag="data-v${DATA_VERSION}"
          release_created=false
          cleanup_incomplete_release() {
            if [[ "$release_created" == "true" ]]; then
              gh release delete "$tag" --yes --cleanup-tag >/dev/null 2>&1 || true
            fi
          }
          upload_with_retry() {
            local asset="$1"
            local attempt
            for attempt in 1 2 3; do
              if gh release upload "$tag" "$asset" --clobber; then
                return 0
              fi
              echo "Upload attempt ${attempt} failed for ${asset}" >&2
              sleep "$((attempt * 20))"
            done
            return 1
          }
          trap cleanup_incomplete_release ERR
          gh release create "data-v${DATA_VERSION}" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "SurvScope data ${DATA_VERSION}" \
            --notes "Compact plot-only RNA/TPM survival data for the cohorts listed in the manifest. TCGA uses TCGA-CDR; CPTAC uses GDC overall survival. No raw matrices or sample identifiers are included."
          release_created=true
          upload_with_retry "$ARCHIVE_NAME"
          upload_with_retry "${ARCHIVE_NAME}.sha256"
          gh release edit "$tag" --draft=false
          trap - ERR
