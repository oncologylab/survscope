name: Deploy static application

on:
  workflow_dispatch:
    inputs:
      data_version:
        description: Data release to deploy (blank selects latest immutable data release)
        required: false
  workflow_run:
    workflows: ["CI", "Build survival data release"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # Bundled regression fixture, deployed when no complete release exists yet.
  FIXTURE_DATA_VERSION: "2026.07.28"
  # First data release that includes the CPTAC-3 cohorts.
  FIRST_CPTAC_DATA_VERSION: "2026.09.18"
  # 850 MiB GitHub Pages budget.
  MAX_SITE_BYTES: "891289600"

concurrency:
  # A skipped PR/failed CI completion must not cancel a production deployment.
  group: >-
    ${{ ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
         (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          (github.event.workflow_run.name != 'CI' || github.event.workflow_run.event == 'push')))
        && 'github-pages' || format('pages-skipped-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.name != 'CI' || github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      DATA_VERSION: ${{ inputs.data_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -e ".[test]"
      - working-directory: web
        run: npm ci
      - name: Validate application at the checked-out commit
        run: |
          ruff check .
          pytest
          npm --prefix web audit --audit-level=high
          npm --prefix web test
          npm --prefix web run build
      - working-directory: web
        run: npx playwright install --with-deps chromium
      - working-directory: web
        run: npm run test:e2e
      - run: scripts/install_r_reference.sh
      - name: Select immutable data version
        shell: bash
        run: |
          if [[ -z "$DATA_VERSION" ]]; then
            tag="$(gh release list --limit 100 --exclude-drafts --exclude-pre-releases \
              --json tagName --jq '[.[].tagName | select(test("^data-v[0-9]{4}\\.[0-9]{2}\\.[0-9]{2}$"))] | sort | last // ""')"
            DATA_VERSION="${tag#data-v}"
            DATA_VERSION="${DATA_VERSION:-$FIXTURE_DATA_VERSION}"
          fi
          if [[ ! "$DATA_VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]]; then
            echo "Invalid DATA_VERSION" >&2
            exit 2
          fi
          echo "DATA_VERSION=$DATA_VERSION" >> "$GITHUB_ENV"
          echo "VITE_DATA_VERSION=$DATA_VERSION" >> "$GITHUB_ENV"
      - name: Use complete release data when available
        shell: bash
        run: |
          if [[ ! "$DATA_VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]]; then
            echo "Invalid DATA_VERSION" >&2
            exit 2
          fi
          tag="data-v${DATA_VERSION}"
          archive_name="survscope-data-${DATA_VERSION}.tar"
          release_ready="$(
            gh release view "$tag" \
              --json isDraft,assets \
              --jq ".isDraft == false and any(.assets[]; .name == \"${archive_name}\")" \
              2>/dev/null || true
          )"
          if [[ "$release_ready" == "true" ]]; then
            release_dir="$(mktemp -d)"
            gh release download "$tag" \
              --pattern "${archive_name}*" \
              --dir "$release_dir"
            (
              cd "$release_dir"
              sha256sum -c "${archive_name}.sha256"
            )
            rm -rf web/public/data
            mkdir -p "web/public/data/${DATA_VERSION}"
            tar -xf "$release_dir/$archive_name" \
              -C "web/public/data/${DATA_VERSION}"
            tcga_cohorts="$(python -c 'from survscope.constants import COHORTS; print(*COHORTS)')"
            validation_args=(--required-cohorts $tcga_cohorts)
            if [[ ! "$DATA_VERSION" < "$FIRST_CPTAC_DATA_VERSION" ]]; then
              cptac_cohorts="$(python -c 'from survscope.cptac import CPTAC_COHORTS; print(*CPTAC_COHORTS)')"
              validation_args+=($cptac_cohorts)
            fi
          else
            if [[ "$DATA_VERSION" != "$FIXTURE_DATA_VERSION" ]]; then
              echo "Requested immutable release is unavailable: $tag" >&2
              exit 2
            fi
            echo "Complete release not found; deploying bundled regression catalog."
            validation_args=(--expected-cohorts 1)
          fi
          python scripts/validate_data_release.py \
            --dir "web/public/data/${DATA_VERSION}" \
            "${validation_args[@]}" \
            --max-bytes "$MAX_SITE_BYTES" \
            --max-assets 999
      - name: Validate statistics across the deployed cohort catalog
        run: |
          python scripts/validate_statistics.py \
            --data-dir "web/public/data/${DATA_VERSION}" \
            --data-version "$DATA_VERSION" \
            --genes SRD5A1 TP53 EGFR
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-statistical-validation
          path: data-build/statistical-validation.json
          if-no-files-found: warn
      - working-directory: web
        run: npm run build
      - name: Enforce Pages artifact budget
        shell: bash
        run: |
          bytes="$(du -sb web/dist | cut -f1)"
          echo "Pages artifact: ${bytes} bytes"
          test "$bytes" -le "$MAX_SITE_BYTES"
      - name: Confirm the tested commit is still current
        run: |
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$(git rev-parse HEAD)" = "$current_main"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
