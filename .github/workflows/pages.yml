name: Deploy static application

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/validate_data_release.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      data_version:
        description: Data release to deploy
        required: true
        default: "2026.07.28"
  workflow_run:
    workflows: ["Build TCGA data release"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      DATA_VERSION: ${{ inputs.data_version || '2026.07.28' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Use complete release data when available
        shell: bash
        run: |
          if [[ ! "$DATA_VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]]; then
            echo "Invalid DATA_VERSION" >&2
            exit 2
          fi
          tag="data-v${DATA_VERSION}"
          archive_name="survscope-data-${DATA_VERSION}.tar"
          release_ready="$(
            gh release view "$tag" \
              --json isDraft,assets \
              --jq ".isDraft == false and any(.assets[]; .name == \"${archive_name}\")" \
              2>/dev/null || true
          )"
          if [[ "$release_ready" == "true" ]]; then
            release_dir="$(mktemp -d)"
            gh release download "$tag" \
              --pattern "${archive_name}*" \
              --dir "$release_dir"
            (
              cd "$release_dir"
              sha256sum -c "${archive_name}.sha256"
            )
            rm -rf "web/public/data/${DATA_VERSION}"
            mkdir -p "web/public/data/${DATA_VERSION}"
            tar -xf "$release_dir/$archive_name" \
              -C "web/public/data/${DATA_VERSION}"
            expected=33
          else
            echo "Complete release not found; deploying bundled regression catalog."
            expected=1
          fi
          python scripts/validate_data_release.py \
            --dir "web/public/data/${DATA_VERSION}" \
            --expected-cohorts "$expected" \
            --max-bytes 891289600 \
            --max-assets 999
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run build
      - name: Enforce Pages artifact budget
        shell: bash
        run: |
          bytes="$(du -sb web/dist | cut -f1)"
          echo "Pages artifact: ${bytes} bytes"
          test "$bytes" -le 891289600
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
