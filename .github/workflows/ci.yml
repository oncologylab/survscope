name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: ruff check .
      - run: pytest --cov=survscope --cov-report=term-missing
      - if: matrix.python-version == '3.12'
        run: |
          python -m build
          python -m twine check dist/*
          python scripts/validate_data_release.py \
            --dir web/public/data/2026.07.28 \
            --expected-cohorts 1

  web:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm audit --audit-level=high
      - working-directory: web
        run: npm test
      - working-directory: web
        run: npm run build
      - working-directory: web
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - working-directory: web
        run: npm run test:e2e

  statistics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -e ".[test]"
      - working-directory: web
        run: npm ci
      - run: scripts/install_r_reference.sh
      - run: python scripts/validate_statistics.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: statistical-validation
          path: data-build/statistical-validation.json
          if-no-files-found: warn
