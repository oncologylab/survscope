[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "survscope"
version = "0.1.0"
description = "Reproducible TCGA Kaplan-Meier survival plots from compact static data"
readme = "README.md"
license = "MIT"
authors = [{ name = "Yaoxiang Li" }]
requires-python = ">=3.10"
keywords = ["TCGA", "survival", "Kaplan-Meier", "oncology", "bioinformatics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
]

[project.optional-dependencies]
test = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.11,<1",
  "twine>=6,<8",
]

[project.urls]
Homepage = "https://oncologylab.github.io/survscope/"
Repository = "https://github.com/oncologylab/survscope"
Issues = "https://github.com/oncologylab/survscope/issues"

[project.scripts]
survscope = "survscope.cli:main"
survscope-build-data = "survscope.builder:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
